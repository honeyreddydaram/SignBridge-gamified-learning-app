# Docker support — written for when Docker Desktop's engine is available.
# NOTE: this could not be build-tested in the development environment this
# repo was created in (Docker Desktop's daemon was not running there — see
# README.md "Known limitations"). Review before relying on it in production.
#
# Usage:
#   docker compose up --build
# Then open http://localhost:8080
#
# Requires ml/models/{asl_landmark_classifier.joblib,hand_landmarker.task,
# reference_landmarks.json} to already exist on the host (run the ml/
# training pipeline first — see ml/README.md). They're mounted read-only
# into the backend container rather than baked into the image, since they're
# generated artifacts, not source.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signbridge
      POSTGRES_PASSWORD: signbridge
      POSTGRES_DB: signbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://signbridge:signbridge@db:5432/signbridge
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      FRONTEND_ORIGIN: http://localhost:8080
      RECOGNITION_MODEL_PATH: /ml/models/asl_landmark_classifier.joblib
      HAND_LANDMARKER_TASK_PATH: /ml/models/hand_landmarker.task
    volumes:
      - ./ml/models:/ml/models:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
