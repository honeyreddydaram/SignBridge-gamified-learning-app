# Docker support — written for when Docker Desktop's engine is available.
# NOTE: this could not be build-tested in the development environment this
# repo was created in (Docker Desktop's daemon was not running there — see
# README.md "Known limitations"). Review before relying on it in production.
#
# Usage:
#   docker compose up --build
# Then open http://localhost:8080
#
# The backend image is built with the repo root as context (see
# backend/Dockerfile) and bakes in ml/models/{asl_landmark_classifier.joblib,
# reference_landmarks.json} (committed, real trained artifacts) plus
# hand_landmarker.task (downloaded at build time). The volume mount below
# still points at the same in-container path, so if you've retrained the
# model locally, your host copy transparently overrides the baked-in one —
# no rebuild needed to pick up a new model.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signbridge
      POSTGRES_PASSWORD: signbridge
      POSTGRES_DB: signbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://signbridge:signbridge@db:5432/signbridge
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - ./ml/models:/app/ml/models:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"

volumes:
  pgdata:
